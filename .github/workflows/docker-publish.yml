name: Build, Push & Sync to Docker Hub

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v3.1.0)'
        required: false
        type: string
      title:
        description: 'Release title (defaults to tag)'
        required: false
        type: string
      description:
        description: 'Release description / notes'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Semantic Version
        id: version
        run: |
          PKG_VERSION=$(jq -r .version backend/package.json)
          TAG="v${PKG_VERSION}"
          echo "Detected package version: ${PKG_VERSION} -> Tag: ${TAG}"
          echo "pkg_version=${PKG_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

          git fetch --tags || true
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on remote."
            echo "is_new_tag=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${TAG} is new."
            echo "is_new_tag=true" >> $GITHUB_OUTPUT
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "${TAG}" -m "Release ${TAG}"
              git push origin "${TAG}" || true
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'kerklangsi' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: kerklangsi/github-runner-docker
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ steps.version.outputs.tag != '' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'kerklangsi' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kerklangsi/github-runner-docker

      - name: Generate Dynamic Release Notes
        run: |
          python scripts/release_notes.py --tag "${{ inputs.tag || steps.version.outputs.tag || github.ref_name }}" --desc "${{ inputs.description || '' }}" --out dist/release_notes.md

      - name: Create or Update GitHub Release
        if: steps.version.outputs.is_new_tag == 'true' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || steps.version.outputs.tag || github.ref_name }}
          name: ${{ inputs.title || format('GitHub Runner Manager {0}', inputs.tag || steps.version.outputs.tag || github.ref_name) }}
          body_path: dist/release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

