name: github-runner-docker

services:
  github-runner:
    image: kerklangsi/github-runner-docker:latest
    container_name: github-runner-manager
    restart: unless-stopped
    network_mode: bridge
    ports:
      - target: 8080
        published: 8080
        protocol: tcp
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - RUNNERS_DIR=/opt/github-runners
      - RUNNER_TOOL_CACHE=/opt/hostedtoolcache
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /DATA/AppData/github-runner-docker/data
        target: /app/data
      - type: bind
        source: /DATA/AppData/github-runner-docker/runners
        target: /opt/github-runners
      - type: bind
        source: /DATA/AppData/github-runner-docker/shared_data
        target: /opt/shared_data
      - type: bind
        source: /DATA/AppData/github-runner-docker/cache
        target: /home/runner/.cache
    x-casaos:
      envs:
        - container: PORT
          description:
            en_us: Web GUI & Management API Server Port
        - container: DATA_DIR
          description:
            en_us: Database and configuration storage directory
        - container: RUNNER_TOOL_CACHE
          description:
            en_us: Shared Action tool cache directory (Python, Node, etc.)
      ports:
        - container: "8080"
          description:
            en_us: Web Management Console
      volumes:
        - container: /var/run/docker.sock
          description:
            en_us: Host Docker socket for running container workflows
        - container: /app/data
          description:
            en_us: Persistent database and user configuration
        - container: /opt/github-runners
          description:
            en_us: Provisioned runner working directories
        - container: /opt/shared_data
          description:
            en_us: Shared persistent repository data and authentication tokens
        - container: /home/runner/.cache
          description:
            en_us: Unified cache for tool installations (Python, Node) and packages (pip, Playwright, npm)

x-casaos:
  architectures:
    - amd64
    - arm64
  author: Kerk Langsi
  category: Developer Tools
  description:
    en_US: Full-stack Web GUI and Docker container manager for GitHub Actions self-hosted runners. Easily provision, monitor, control, and update multiple GitHub runner instances from a high-performance web dashboard.
  developer: Kerk Langsi
  icon: https://raw.githubusercontent.com/kerklangsi/github-runner/main/icon.svg
  id: github-runner-docker
  index: /
  is_store: true
  main: github-runner
  port_map: "8080"
  scheme: http
  store_app_id: github-runner-docker
  title:
    en_US: GitHub Runner Manager
  tagline:
    en_US: Web GUI & Container Supervisor for GitHub Actions Self-Hosted Runners
  thumbnail: https://raw.githubusercontent.com/kerklangsi/github-runner/main/icon.svg
  version: 3.2.0
