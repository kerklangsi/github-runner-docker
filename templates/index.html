<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Runner Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0d1117;
      --panel-bg: rgba(22, 27, 34, 0.85);
      --border-color: #30363d;
      --accent-blue: #58a6ff;
      --accent-green: #238636;
      --accent-green-hover: #2ea043;
      --accent-red: #da3633;
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --text-bright: #f0f6fc;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(88, 166, 255, 0.08) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(35, 134, 54, 0.08) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.25rem 1.75rem;
    }

    .logo-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      fill: var(--accent-blue);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-bright);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 8px currentColor;
    }

    .status-running { background: rgba(35, 134, 54, 0.15); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
    .status-stopped { background: rgba(218, 54, 51, 0.15); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
    .status-starting { background: rgba(210, 153, 34, 0.15); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }

    .card {
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text-bright);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .power-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: rgba(13, 17, 23, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    .power-info label {
      font-weight: 600;
      color: var(--text-bright);
      display: block;
      margin-bottom: 0.2rem;
    }

    .power-info span {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #30363d;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px; width: 20px;
      left: 4px; bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider:before { transform: translateX(24px); }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .form-group input[type="text"],
    .form-group input[type="password"] {
      background: rgba(13, 17, 23, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.65rem 0.85rem;
      color: var(--text-bright);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      margin-top: 0.25rem;
    }

    .checkbox-group input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent-blue);
    }

    .checkbox-group label {
      font-size: 0.85rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .btn {
      background: var(--accent-green);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.25rem;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover { background: var(--accent-green-hover); }
    .btn:active { transform: scale(0.98); }

    .console-card {
      grid-column: 1 / -1;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .console-box {
      background: #011627;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem;
      font-family: 'Fira Code', monospace;
      font-size: 0.82rem;
      color: #d6deeb;
      height: 240px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--accent-blue);
      color: var(--text-bright);
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo-group">
      <svg class="logo-icon" viewBox="0 0 24 24">
        <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
      </svg>
      <div>
        <h1>GitHub Actions Runner</h1>
        <span style="font-size: 0.8rem; color: var(--text-muted);">Self-Hosted Container Dashboard</span>
      </div>
    </div>
    <div id="status-badge" class="badge status-stopped">
      <span class="badge-dot"></span>
      <span id="status-text">OFFLINE</span>
    </div>
  </header>

  <div class="grid">
    <div class="card">
      <div class="card-title">
        <span>⚡ Runner Controls</span>
      </div>

      <div class="power-section">
        <div class="power-info">
          <label>Runner Service Power</label>
          <span id="power-desc">Turn runner process ON or OFF</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="power-toggle" onchange="toggleRunner(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="auto-start" checked>
        <label for="auto-start">Auto-start runner when container boots</label>
      </div>
    </div>

    <div class="card">
      <div class="card-title">
        <span>⚙️ Configuration</span>
      </div>

      <div class="form-group">
        <label>Target GitHub URL (Repository / Org)</label>
        <input type="text" id="target-url" placeholder="https://github.com/owner/repo">
      </div>

      <div class="form-group">
        <label>Personal Access Token (PAT)</label>
        <input type="password" id="access-token" placeholder="ghp_xxxxxxxxxxxx">
      </div>

      <div class="form-group">
        <label>Runner Name</label>
        <input type="text" id="runner-name" placeholder="runner-zimaos">
      </div>

      <div class="form-group">
        <label>Runner Labels (comma separated)</label>
        <input type="text" id="runner-labels" placeholder="self-hosted,linux,x64,docker">
      </div>

      <button class="btn" onclick="saveConfig()">
        💾 Save Configuration
      </button>
    </div>

    <div class="card console-card">
      <div class="console-header">
        <div class="card-title">
          <span>📜 Runner Execution Logs</span>
        </div>
        <button class="btn" style="padding: 0.4rem 0.8rem; font-size: 0.8rem; background: #30363d;" onclick="fetchLogs()">
          🔄 Refresh Logs
        </button>
      </div>
      <div class="console-box" id="log-console">Loading runner logs...</div>
    </div>
  </div>
</div>

<div class="toast" id="toast">Settings saved successfully!</div>

<script>
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.innerText = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function fetchStatus() {
    fetch('/api/status')
      .then(res => res.json())
      .then(data => {
        const badge = document.getElementById('status-badge');
        const text = document.getElementById('status-text');
        const toggle = document.getElementById('power-toggle');

        if (data.status === 'RUNNING') {
          badge.className = 'badge status-running';
          text.innerText = 'ONLINE / IDLE';
          toggle.checked = true;
        } else if (data.status === 'STARTING') {
          badge.className = 'badge status-starting';
          text.innerText = 'REGISTERING...';
          toggle.checked = true;
        } else {
          badge.className = 'badge status-stopped';
          text.innerText = 'STOPPED';
          toggle.checked = false;
        }

        if (data.config) {
          if (document.getElementById('target-url').value === '') document.getElementById('target-url').value = data.config.target_url || '';
          if (document.getElementById('access-token').value === '' && data.config.has_token) document.getElementById('access-token').value = '********';
          if (document.getElementById('runner-name').value === '') document.getElementById('runner-name').value = data.config.runner_name || '';
          if (document.getElementById('runner-labels').value === '') document.getElementById('runner-labels').value = data.config.runner_labels || '';
          document.getElementById('auto-start').checked = data.config.auto_start !== false;
        }

        if (data.logs) {
          const consoleBox = document.getElementById('log-console');
          consoleBox.innerText = data.logs.join('\n');
          consoleBox.scrollTop = consoleBox.scrollHeight;
        }
      });
  }

  function toggleRunner(enable) {
    fetch('/api/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enable: enable })
    })
    .then(res => res.json())
    .then(data => {
      showToast(data.message);
      setTimeout(fetchStatus, 1000);
    });
  }

  function saveConfig() {
    const target_url = document.getElementById('target-url').value;
    const access_token = document.getElementById('access-token').value;
    const runner_name = document.getElementById('runner-name').value;
    const runner_labels = document.getElementById('runner-labels').value;
    const auto_start = document.getElementById('auto-start').checked;

    fetch('/api/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        target_url: target_url,
        access_token: access_token === '********' ? '' : access_token,
        runner_name: runner_name,
        runner_labels: runner_labels,
        auto_start: auto_start
      })
    })
    .then(res => res.json())
    .then(data => {
      showToast(data.message);
      setTimeout(fetchStatus, 1000);
    });
  }

  function fetchLogs() {
    fetchStatus();
  }

  fetchStatus();
  setInterval(fetchStatus, 5000);
</script>
</body>
</html>
